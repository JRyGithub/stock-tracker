version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Let new releases settle before upgrading
    cooldown:
      default-days: 14
    ignore:
      # Types must match the Node runtime (see .nvmrc). Bump this major together with Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
